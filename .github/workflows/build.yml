name: Compile and publish kernels

on:
  push:
    branches:
      - ARC-Migration
      - arc-speed

env:
  - BUILD_ARCHES: ["armel", "mipseb", "mipsel", "mips64eb", "mips64el"]

jobs:
  build:
    runs-on: panda-arc
    strategy:
      matrix:
        arch: ${{ env.BUILD_ARCHES }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build 
        run: |
          bash docker_build.sh ${{ matrix.arch }}
          tar -c -I 'xz -6 -T0' -f kernels-latest-${{ matrix.arch }}.tar.xz binaries

      - name: Save package
        uses: actions/upload-artifact@v3
        with:
          name: kernels-latest-${{ matrix.arch }}.tar.gx
          path: kernels-latest-${{ matrix.arch }}.tar.gx

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release_${{ github.sha }}
          release_name: Release ${{ github.ref }}
          body: |
            Release @${{ github.ref }}
          draft: true
          prerelease: false
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v3

      - name: Combine all artifacts
        run: |
          mkdir -p binaries
          for f in ${{ env.BUILD_ARCHES }}; do mv "kernels-latest-$f.tar.gz" binaries; done
          tar -cvf kernels-latest.tar binaries
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./kernels-latest.tar.gz
          asset_name: kernels-latest.tar.gz
          asset_content_type: application/gzip
      - name: Publish release
        uses: StuYarrow/publish-release@v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.create_release.outputs.id }}